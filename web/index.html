<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体育直播回看 · 动态时间窗</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header>
  <h1>体育直播回看内核</h1>
  <div class="sub">动态清单 → 可用时间窗 → 实际播放点。播放内容按需从源编码，不是一条长视频。</div>
</header>

<main>
  <section class="stage">
    <div class="video-wrap">
      <video id="video" muted playsinline></video>
      <div id="bootError" class="boot-error" hidden></div>
    </div>
    <div class="status-row">
      <div id="freshness" class="badge">等待清单…</div>
      <div id="modeBadge" class="badge mode">直播</div>
    </div>

    <div class="controls">
      <button id="back10" title="回看 10 秒">−10s</button>
      <button id="back30" title="回看 30 秒">−30s</button>
      <button id="live" class="primary" title="回到直播附近">回到直播</button>
      <label class="seek">
        <span>回看定位</span>
        <input id="seekRange" type="range" min="0" max="1000" value="0" step="1">
        <span id="seekLabel" class="mono">—</span>
      </label>
    </div>

    <div class="range-card">
      <div class="range-head">
        <span>可用时间窗</span>
        <span id="rangeText" class="mono">—</span>
      </div>
      <div class="timeline" id="timeline">
        <div id="windowBar" class="window-bar"></div>
        <div id="playhead" class="playhead" title="实际播放点"></div>
        <div id="liveEdge" class="live-edge"></div>
        <div id="evictedMarks" class="evicted-marks"></div>
      </div>
      <div class="legend">
        <span><i class="sw window"></i> 窗口内可播放</span>
        <span><i class="sw evicted"></i> 已移出（拒绝或重定位）</span>
        <span><i class="sw head"></i> 实际播放点</span>
        <span><i class="sw live"></i> 最后确认边缘</span>
      </div>
    </div>
  </section>

  <section class="panels">
    <div class="panel">
      <h2>源与新鲜度</h2>
      <dl id="sourceInfo"></dl>
      <div id="freshnessDetail" class="detail"></div>
    </div>

    <div class="panel">
      <h2>播放点与真实帧号</h2>
      <dl id="playheadInfo"></dl>
      <div class="frame-check">
        <button id="verifyFrame" class="primary">采样当前帧</button>
        <span id="frameResult" class="mono">尚未采样</span>
      </div>
    </div>

    <div class="panel">
      <h2>三套时间</h2>
      <dl id="clocksInfo"></dl>
    </div>

    <div class="panel wide">
      <h2>事件</h2>
      <ul id="events" class="events"></ul>
    </div>
  </section>
</main>

<script type="module" src="/web/ui.mjs"></script>
<script type="module" src="/web/player.mjs"></script>
</body>
</html>
